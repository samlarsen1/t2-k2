[project]
name = "t2k2"
version = "0.2.0"
description = "Gain-harvesting droid: trims overbought Trading212 holdings to lock in profits"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "structlog>=24.1",
    "yfinance>=0.2.50",
]

[project.scripts]
t2k2-harvest = "t2k2.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pip-audit>=2.9",
    "pre-commit>=3.7",
    "pytest>=8",
    "ruff>=0.4",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/t2k2"]

[tool.uv]
# Supply-chain cooldown: ignore package versions published in the last 7 days
exclude-newer = "7 days"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.bandit]
exclude_dirs = [".venv"]

[tool.bandit.assert_used]
skips = ["*/tests/*", "*/test_*.py"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
